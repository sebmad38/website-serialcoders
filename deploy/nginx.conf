# Template for Ubuntu + Nginx on Lightsail. Configure TLS before public launch.
# Keep the default server and existing virtual hosts intact until reviewed.
server {
    listen 80;
    server_name serialcoders.fr www.serialcoders.fr;
    root /var/www/serialcoders/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/contact {
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    location = /404.html { internal; }
    error_page 404 /404.html;
    location ~* \.(css|js|png)$ {
        expires 1h;
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }
}
