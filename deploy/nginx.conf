# Template for Ubuntu + Nginx on Lightsail. Configure TLS before public launch.
# Keep the default server and existing virtual hosts intact until reviewed.
limit_conn_zone $server_name zone=contact_total:1m;
limit_req_zone $binary_remote_addr zone=contact_rate:1m rate=5r/m;

server {
    listen 80;
    server_name serialcoders.fr www.serialcoders.fr;
    root /var/www/serialcoders/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/contact {
        # Do not accept personal data until the domain has a valid TLS certificate.
        if ($scheme != "https") { return 503; }
        client_max_body_size 15m;
        # Bound memory use on the 1 GB instance, including concurrent uploads.
        limit_conn contact_total 2;
        limit_conn_status 429;
        limit_req zone=contact_rate burst=2 nodelay;
        limit_req_status 429;
        client_body_timeout 20s;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    location = /404.html { internal; }
    error_page 404 /404.html;
    location ~* \.(css|js|png)$ {
        expires 1h;
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }
}
