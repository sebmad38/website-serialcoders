# Temporary IP preview: no indexing and no transmission of personal data over HTTP.
server {
    listen 80;
    server_name 13.39.55.229;
    root /var/www/serialcoders/current;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    location = /api/contact {
        default_type application/json;
        return 503 '{"message":"Envoi disponible après activation du domaine et de HTTPS."}';
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
